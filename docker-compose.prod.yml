# Radian — Production compose (একটা VPS-এ চারটাই)。
#
# এটা কখন লাগবে: যেদিন আসল বিক্রি শুরু হবে। Vercel-এর ফ্রি Hobby প্ল্যান
# terms-এ অ-বাণিজ্যিক, তাই real version হয় Vercel Pro ($20/মাস) নয়তো
# একটা VPS ($5-7/মাস)। এই ফাইলটা দ্বিতীয় পথের জন্য — আজই বানিয়ে রাখা হলো
# যাতে সেদিন নতুন করে কিছু বানাতে না হয়。
#
# লোকাল dev-এ এটা নয় — `docker-compose.yml` (hot-reload) অক্ষত আছে。
#
# চালানোর নিয়ম:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# ⚠️ Postgres-এ ইচ্ছাকৃতভাবে `ports:` নেই। DB শুধু ভেতরের network-এ থাকবে।
#    ৫৪৩২ ইন্টারনেটে খুললে দুই দিনের মধ্যে bot খুঁজে পায় — এটা অনুমান নয়。

services:
  postgres:
    image: postgres:16-alpine
    container_name: radian_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - radian_pg_prod:/var/lib/postgresql/data
      # রোজকার ব্যাকআপ এখানে ফেলবেন (cron + pg_dump)
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: radian_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    # ⚠️ কোনো volume mount নেই — production-এ image-এর ভেতরের build করা কোডই
    #    চলবে। লোকাল ফোল্ডার mount করলে dist/ মুছে গিয়ে container মরে যাবে।
    expose:
      - "4000"

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.prod
      args:
        # build-time — এখানেই বসতে হবে, চালু করার সময় নয়
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        # "View website" and every storefront link in the admin follow this;
        # without it the code falls back to the demo Vercel URL (api.ts)
        NEXT_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
    container_name: radian_admin_prod
    restart: always
    depends_on:
      - api
    expose:
      - "3001"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL}
        NEXT_PUBLIC_IMAGE_BASE: ${NEXT_PUBLIC_IMAGE_BASE}
    container_name: radian_web_prod
    restart: always
    depends_on:
      - api
    env_file:
      - .env.production
    expose:
      - "3000"

  # Caddy — HTTPS সার্টিফিকেট নিজে এনে নিজে নবায়ন করে (Nginx + Certbot-এর
  # ঝামেলা ছাড়া)। শুধু ৮০/৪৪৩ বাইরে খোলা, বাকি সব ভেতরে。
  caddy:
    image: caddy:2-alpine
    container_name: radian_caddy
    restart: always
    depends_on:
      - web
      - admin
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  radian_pg_prod:
  caddy_data:
  caddy_config:
